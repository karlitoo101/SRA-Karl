<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Regulatory Administration - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/enteremail.css">
</head>
<body>
    <a href="login.html" class="back-button">
        <i class="fas fa-chevron-left"></i>
    </a>
    
    <div class="container">
        <div class="logo">
            <img src="../resources/SRA_thumbnail.png" alt="Department of Agriculture Logo">
        </div>
        
        <h1>Forgot password</h1>
        <p class="instruction">Please enter your email to reset the password</p>
        <form action="" method="">
            <label class="input-label">Your email</label>
            <input type="email" class="email-input" placeholder="Enter your email">
            <button class="reset-btn">RESET PASSWORD</button>
        </form>
    </div>
</body>
</html>
